# AdigeHost - Nginx reverse proxy + statik frontend + SSL
# /etc/nginx/sites-available/adigehost.conf -> sites-enabled/ sembolik linki
# SSL: certbot --nginx -d panel.adigehost.com  (Let's Encrypt)

# HTTP -> HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name panel.adigehost.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.adigehost.com;

    # --- SSL (certbot tarafından doldurulur) ---
    # ssl_certificate     /etc/letsencrypt/live/panel.adigehost.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/panel.adigehost.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- Güvenlik başlıkları ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gerçek istemci IP'si (Cloudflare arkasında CF-Connecting-IP de kullanılabilir)
    real_ip_header X-Forwarded-For;

    client_max_body_size 10M;

    # --- Frontend (statik build) ---
    root /var/www/adigehost/frontend/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik varlık önbelleği
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Backend API (Node.js / PM2 localhost:5000) ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
